    <!-- ============================================================
         特色字體（精緻淺色金融風 ── 像私人銀行 / 高級財經刊物）
         - Fraunces：高對比、有個性的襯線顯示字體，用在大標題（高雅、不罐頭）
         - Manrope：乾淨人文無襯線，用在內文（比 Inter 更有質感）
         - IBM Plex Mono：等寬字，金融數字對齊用（價格、報酬率，帳本感）
         刻意避開 Inter / Roboto / Arial 這類「AI 罐頭味」字體。
         ============================================================ -->
